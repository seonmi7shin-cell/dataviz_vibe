<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>테트리스</title>
<style>
  body {
    background: #111318;
    color: #e8e8e8;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 24px;
    padding: 40px;
  }
  #board {
    background: #1a1d24;
    border: 2px solid #3a3f4b;
  }
  .panel {
    width: 180px;
  }
  .panel h2 {
    font-size: 16px;
    margin: 0 0 8px;
    color: #9aa0ab;
  }
  .stat {
    background: #1a1d24;
    border: 1px solid #3a3f4b;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .stat .value {
    font-size: 24px;
    font-weight: 700;
  }
  #next {
    background: #1a1d24;
    border: 1px solid #3a3f4b;
  }
  #message {
    margin-top: 12px;
    font-size: 14px;
    color: #f0a04b;
    min-height: 40px;
  }
  #controls {
    font-size: 12px;
    color: #6b7280;
    line-height: 1.6;
  }
  button {
    background: #2a78d6;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: #256abf; }
</style>
</head>
<body>
  <canvas id="board" width="240" height="480"></canvas>
  <div class="panel">
    <h2>다음 블록</h2>
    <canvas id="next" width="120" height="120"></canvas>

    <h2 style="margin-top:20px">점수</h2>
    <div class="stat"><div class="value" id="score">0</div></div>

    <h2>레벨</h2>
    <div class="stat"><div class="value" id="level">1</div></div>

    <h2>지운 줄</h2>
    <div class="stat"><div class="value" id="lines">0</div></div>

    <button id="startBtn">시작 / 일시정지</button>
    <div id="message"></div>
    <div id="controls">
      ← → : 이동<br>
      ↑ : 회전<br>
      ↓ : 빠르게 내리기<br>
      space : 바로 떨어뜨리기<br>
      P : 일시정지
    </div>
  </div>

<script>
// 보드는 10x20칸, 한 칸은 24px. 이 두 상수가 캔버스 크기(240x480)와 맞물려 있어서
// 바꾸려면 캔버스 width/height도 같이 바꿔야 한다.
const COLS = 10, ROWS = 20, CELL = 24;
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const nextCanvas = document.getElementById("next");
const nextCtx = nextCanvas.getContext("2d");

// 각 테트로미노를 회전 상태 4개짜리 2차원 배열로 미리 정의해두면
// 회전할 때마다 계산하지 않고 배열 인덱스만 바꾸면 되어 간단하다.
const SHAPES = {
  I: { color: "#2a78d6", rotations: [
    [[0,1],[1,1],[2,1],[3,1]],
    [[2,0],[2,1],[2,2],[2,3]],
    [[0,2],[1,2],[2,2],[3,2]],
    [[1,0],[1,1],[1,2],[1,3]],
  ]},
  O: { color: "#eda100", rotations: [
    [[1,0],[2,0],[1,1],[2,1]],
    [[1,0],[2,0],[1,1],[2,1]],
    [[1,0],[2,0],[1,1],[2,1]],
    [[1,0],[2,0],[1,1],[2,1]],
  ]},
  T: { color: "#8172B2", rotations: [
    [[1,0],[0,1],[1,1],[2,1]],
    [[1,0],[1,1],[2,1],[1,2]],
    [[0,1],[1,1],[2,1],[1,2]],
    [[1,0],[0,1],[1,1],[1,2]],
  ]},
  S: { color: "#1baf7a", rotations: [
    [[1,0],[2,0],[0,1],[1,1]],
    [[1,0],[1,1],[2,1],[2,2]],
    [[1,1],[2,1],[0,2],[1,2]],
    [[0,0],[0,1],[1,1],[1,2]],
  ]},
  Z: { color: "#e34948", rotations: [
    [[0,0],[1,0],[1,1],[2,1]],
    [[2,0],[1,1],[2,1],[1,2]],
    [[0,1],[1,1],[1,2],[2,2]],
    [[1,0],[0,1],[1,1],[0,2]],
  ]},
  J: { color: "#3987e5", rotations: [
    [[0,0],[0,1],[1,1],[2,1]],
    [[1,0],[2,0],[1,1],[1,2]],
    [[0,1],[1,1],[2,1],[2,2]],
    [[1,0],[1,1],[0,2],[1,2]],
  ]},
  L: { color: "#eb6834", rotations: [
    [[2,0],[0,1],[1,1],[2,1]],
    [[1,0],[1,1],[1,2],[2,2]],
    [[0,1],[1,1],[2,1],[0,2]],
    [[0,0],[1,0],[1,1],[1,2]],
  ]},
};
const SHAPE_NAMES = Object.keys(SHAPES);

let grid, current, currentName, rotation, posX, posY, nextName;
let score, level, linesCleared, dropInterval, dropTimer, running, gameOver;

function emptyGrid() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

function randomShapeName() {
  return SHAPE_NAMES[Math.floor(Math.random() * SHAPE_NAMES.length)];
}

function spawn() {
  currentName = nextName || randomShapeName();
  nextName = randomShapeName();
  rotation = 0;
  posX = 3;
  posY = -1;
  if (collides(posX, posY, rotation)) {
    gameOver = true;
    running = false;
    document.getElementById("message").textContent = "게임 오버! 시작 버튼으로 다시 시작하세요.";
  }
  drawNext();
}

function cellsOf(name, rot, x, y) {
  return SHAPES[name].rotations[rot].map(([cx, cy]) => [x + cx, y + cy]);
}

function collides(x, y, rot) {
  return cellsOf(currentName, rot, x, y).some(([cx, cy]) => {
    if (cx < 0 || cx >= COLS || cy >= ROWS) return true;
    if (cy < 0) return false;
    return grid[cy][cx] !== null;
  });
}

function lockPiece() {
  cellsOf(currentName, rotation, posX, posY).forEach(([cx, cy]) => {
    if (cy >= 0) grid[cy][cx] = SHAPES[currentName].color;
  });
  clearLines();
  spawn();
}

function clearLines() {
  // 꽉 찬 줄을 걸러내고 위쪽에 빈 줄을 채워 넣는 방식이, 인덱스를 옮기며 지우는 것보다 간단하고 안전하다
  const remaining = grid.filter(row => row.some(cell => cell === null));
  const cleared = ROWS - remaining.length;
  if (cleared > 0) {
    const newRows = Array.from({ length: cleared }, () => Array(COLS).fill(null));
    grid = newRows.concat(remaining);
    linesCleared += cleared;
    // 한 번에 여러 줄을 지우면 보너스를 줘야 테트리스(4줄)가 더 가치있게 느껴진다
    const points = [0, 100, 300, 500, 800][cleared] * level;
    score += points;
    level = 1 + Math.floor(linesCleared / 10);
    dropInterval = Math.max(100, 1000 - (level - 1) * 80);
    updateStats();
  }
}

function updateStats() {
  document.getElementById("score").textContent = score;
  document.getElementById("level").textContent = level;
  document.getElementById("lines").textContent = linesCleared;
}

function move(dx) {
  if (!collides(posX + dx, posY, rotation)) posX += dx;
  draw();
}

function rotate() {
  const newRot = (rotation + 1) % 4;
  // 벽에 붙어 회전이 막히면 좌우로 한 칸씩 밀어보는 간단한 "월킥" 처리
  for (const kick of [0, -1, 1, -2, 2]) {
    if (!collides(posX + kick, posY, newRot)) {
      posX += kick;
      rotation = newRot;
      draw();
      return;
    }
  }
}

function softDrop() {
  if (!collides(posX, posY + 1, rotation)) {
    posY += 1;
    score += 1;
    updateStats();
  } else {
    lockPiece();
  }
  draw();
}

function hardDrop() {
  while (!collides(posX, posY + 1, rotation)) {
    posY += 1;
    score += 2;
  }
  updateStats();
  lockPiece();
  draw();
}

function draw() {
  ctx.fillStyle = "#1a1d24";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y][x]) drawCell(ctx, x, y, grid[y][x]);
    }
  }
  if (!gameOver) {
    cellsOf(currentName, rotation, posX, posY).forEach(([cx, cy]) => {
      if (cy >= 0) drawCell(ctx, cx, cy, SHAPES[currentName].color);
    });
  }

  // 격자선은 배경보다 살짝 밝은 정도로만 그려야 블록 색이 묻히지 않는다
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL, 0);
    ctx.lineTo(x * CELL, ROWS * CELL);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL);
    ctx.lineTo(COLS * CELL, y * CELL);
    ctx.stroke();
  }
}

function drawCell(context, x, y, color) {
  context.fillStyle = color;
  context.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
}

function drawNext() {
  nextCtx.fillStyle = "#1a1d24";
  nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  const cellSize = 24;
  SHAPES[nextName].rotations[0].forEach(([cx, cy]) => {
    nextCtx.fillStyle = SHAPES[nextName].color;
    nextCtx.fillRect(cx * cellSize + 4, cy * cellSize + 4, cellSize - 4, cellSize - 4);
  });
}

function tick() {
  if (!running) return;
  softDrop();
}

function startLoop() {
  clearInterval(dropTimer);
  dropTimer = setInterval(tick, dropInterval);
}

function resetGame() {
  grid = emptyGrid();
  score = 0; level = 1; linesCleared = 0;
  dropInterval = 1000;
  gameOver = false;
  nextName = randomShapeName();
  updateStats();
  document.getElementById("message").textContent = "";
  spawn();
  draw();
}

document.getElementById("startBtn").addEventListener("click", () => {
  if (gameOver) resetGame();
  running = !running;
  if (running) {
    startLoop();
    document.getElementById("message").textContent = "";
  } else {
    clearInterval(dropTimer);
    document.getElementById("message").textContent = "일시정지됨";
  }
});

document.addEventListener("keydown", (e) => {
  if (gameOver) return;
  switch (e.key) {
    case "ArrowLeft": move(-1); e.preventDefault(); break;
    case "ArrowRight": move(1); e.preventDefault(); break;
    case "ArrowUp": rotate(); e.preventDefault(); break;
    case "ArrowDown": softDrop(); e.preventDefault(); break;
    case " ": hardDrop(); e.preventDefault(); break;
    case "p": case "P":
      running = !running;
      if (running) startLoop(); else clearInterval(dropTimer);
      break;
  }
});

resetGame();
</script>
</body>
</html>
